<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝒑𝒐𝒎𝒐𝒅𝒐𝒓𝒐 𝒕𝒊𝒎𝒆𝒓</title>

  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="tomato.png">
  <link rel="apple-touch-icon" href="tomato.png">

  <link rel="stylesheet" href="style.css">
  <!-- defer: HTML을 다 읽은 뒤 실행되므로 <body> 끝에 둘 필요가 없음 -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">

    <!-- 빗소리 플레이어 -->
    <audio id="rainSound" src="rain.mp3" loop preload="none"></audio>
    <div class="rain-player">
      <div class="rain-title">🌧️ 빗소리 백색소음</div>
      <button id="rainToggle" class="rain-btn" type="button" aria-label="빗소리 재생">▶</button>
      <div class="volume-control">
        <button id="muteToggle" class="volume-icon" type="button" aria-label="음소거">🔊</button>
        <div class="volume-dropdown">
          <input type="range" id="volumeSlider" class="volume-slider"
                 min="0" max="1" step="0.01" value="0.5" aria-label="빗소리 볼륨">
        </div>
      </div>
    </div>

    <main class="main-content">
      <!-- 설정 영역 -->
      <div class="settings">
        <select id="timePreset" aria-label="집중/휴식 시간">
          <option value="25-5">25분 집중 / 5분 휴식</option>
          <option value="50-10">50분 집중 / 10분 휴식</option>
        </select>
        <div class="stepper" role="group" aria-label="반복 횟수">
          <button type="button" class="step-btn" id="repeatMinus" aria-label="반복 횟수 줄이기">−</button>
          <output id="repeatValue" aria-live="polite">4세트</output>
          <button type="button" class="step-btn" id="repeatPlus" aria-label="반복 횟수 늘리기">+</button>
        </div>
        <button id="apply-btn" type="button">적용</button>
        <button id="reset-btn" type="button">초기화</button>
      </div>

      <!-- 상태 메시지 -->
      <div class="status" id="statusText" aria-live="polite">귀여운 토마토가<br class="mobile-break"> 당신을 기다리고 있어요!✨</div>

      <!-- 세트 카운터 + 건너뛰기 -->
      <div class="counter-row">
        <div class="set-counter" id="setCounter">완료한 세트: 0세트</div>
        <button id="skip-btn" class="skip-btn" type="button" title="지금 세션을 끝내고 다음으로 넘어가요">⏭ 건너뛰기</button>
      </div>

      <!-- 토마토 타이머 -->
      <div class="tomato-wrapper">
        <div class="tomato" id="tomato" role="button" tabindex="0" aria-label="타이머 시작/일시 정지">
          <img src="tomato.png" alt="" class="tomato-img" draggable="false">
          <div class="timer-display" id="display">25:00</div>
        </div>
      </div>

      <!-- 가이드 -->
      <p class="guide">1. 토마토를 클릭하거나 스페이스바를 눌러 시작/일시 정지할 수 있습니다.</p>
      <p class="guide">2. 시간이 다 되면 알람음이 울립니다.</p>
    </main>

    <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>

    <footer class="footer">
      © 2026 Hailey. All rights reserved.
    </footer>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 꾸미기 이미지 (PC 전용) -->
  <img src="corner.png" alt="" class="decoration corner-decoration" aria-hidden="true">
  <img src="note.png" alt="" class="decoration note-decoration" aria-hidden="true">
  <img src="note.png" alt="" class="decoration note-decoration-2" aria-hidden="true">
</body>
</html>

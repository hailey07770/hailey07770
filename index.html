<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝒑𝒐𝒎𝒐𝒅𝒐𝒓𝒐 𝒕𝒊𝒎𝒆𝒓</title>

  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="tomato.png">
  <link rel="apple-touch-icon" href="tomato.png">

  <link rel="stylesheet" href="style.css">
  <!-- defer: HTML을 다 읽은 뒤 실행되므로 <body> 끝에 둘 필요가 없음 -->
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">

    <!-- 유튜브 플레이어 (링크를 넣으면 배경음악처럼 재생) -->
    <div class="music-player" id="musicPlayer">
      <div class="music-title">🎵 유튜브 플레이어</div>
      <button id="musicToggle" class="music-btn" type="button" aria-label="재생">▶</button>
      <div class="volume-control">
        <button id="muteToggle" class="volume-icon" type="button" aria-label="음소거">🔊</button>
        <div class="volume-dropdown">
          <input type="range" id="volumeSlider" class="volume-slider"
                 min="0" max="1" step="0.01" value="0.5" aria-label="음악 볼륨">
        </div>
      </div>
      <button id="linkToggle" class="volume-icon link-btn" type="button"
              aria-label="유튜브 링크 넣기" aria-expanded="false" aria-controls="musicPanel">🔗</button>

      <!-- 링크 입력 + 영상 패널 -->
      <div class="music-panel" id="musicPanel">
        <form class="music-form" id="musicForm" autocomplete="off" novalidate>
          <input type="url" id="musicUrl" placeholder="유튜브 링크를 붙여넣으세요"
                 aria-label="유튜브 링크" spellcheck="false">
          <button type="submit" class="music-load">불러오기</button>
        </form>
        <div class="music-video"><div id="ytPlayer"></div></div>
        <p class="music-now" id="musicNow">영상이나 재생목록 링크를 넣으면 반복 재생돼요</p>
      </div>
    </div>

    <main class="main-content">
      <!-- 설정 영역 -->
      <div class="settings">
        <div class="dropdown" id="timePreset">
          <button type="button" class="dropdown-toggle" id="presetToggle"
                  aria-haspopup="listbox" aria-expanded="false" aria-label="집중/휴식 시간">
            <span id="presetLabel">25분 집중 / 5분 휴식</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <ul class="dropdown-menu" id="presetMenu" role="listbox" tabindex="-1" aria-label="집중/휴식 시간">
            <li role="option" data-value="25-5" aria-selected="true">25분 집중 / 5분 휴식</li>
            <li role="option" data-value="50-10" aria-selected="false">50분 집중 / 10분 휴식</li>
          </ul>
        </div>
        <div class="stepper" role="group" aria-label="반복 횟수">
          <button type="button" class="step-btn" id="repeatMinus" aria-label="반복 횟수 줄이기">−</button>
          <output id="repeatValue" aria-live="polite">4세트</output>
          <button type="button" class="step-btn" id="repeatPlus" aria-label="반복 횟수 늘리기">+</button>
        </div>
        <button id="apply-btn" type="button">적용</button>
        <button id="reset-btn" type="button">초기화</button>
      </div>

      <!-- 상태 메시지 -->
      <div class="status" id="statusText" aria-live="polite">귀여운 토마토가<br class="mobile-break"> 당신을 기다리고 있어요!✨</div>

      <!-- 세트 카운터 + 건너뛰기 -->
      <div class="counter-row">
        <div class="set-counter" id="setCounter">완료한 세트: 0세트</div>
        <button id="skip-btn" class="skip-btn" type="button" title="지금 세션을 끝내고 다음으로 넘어가요">⏭ 건너뛰기</button>
      </div>

      <!-- 토마토 타이머 -->
      <div class="tomato-wrapper">
        <div class="tomato" id="tomato" role="button" tabindex="0" aria-label="타이머 시작/일시 정지">
          <img src="tomato.png" alt="" class="tomato-img" draggable="false">
          <div class="timer-display" id="display">25:00</div>
        </div>
      </div>

      <!-- 가이드 -->
      <p class="guide">1. 토마토를 클릭하거나 스페이스바를 눌러 시작/일시 정지할 수 있습니다.</p>
      <p class="guide">2. 시간이 다 되면 알람음이 울립니다.</p>
    </main>

    <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>

    <footer class="footer">
      © 2026 Hailey. All rights reserved.
    </footer>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 꾸미기 이미지 (PC 전용) -->
  <img src="corner.png" alt="" class="decoration corner-decoration" aria-hidden="true">
  <img src="note.png" alt="" class="decoration note-decoration" aria-hidden="true">
  <img src="note.png" alt="" class="decoration note-decoration-2" aria-hidden="true">
</body>
</html>
